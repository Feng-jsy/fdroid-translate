pluginManagement {
    repositories {
        // Aliyun mirrors only: direct Google/Central/Plugin Portal are unreachable
        // on this network and would stall the build for minutes on timeout.
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
}

include ':app'
include ':libs:core'
include ':libs:sharedTest'
include ':libs:download'
include ':libs:index'
include ':libs:database'
